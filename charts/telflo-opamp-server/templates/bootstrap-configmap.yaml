{{- include "telflo-opamp-server.guards" . }}
{{- /*
bootstrap.sql (the database and its roles) and initdb.sh (which runs it once,
when a postgres image first creates its data). Always rendered: the bundled
Postgres mounts it, and so can any other Postgres (README.md, "Bootstrapping
another Postgres").
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "telflo-opamp-server.bootstrapName" . | quote }}
  labels:
    {{- include "telflo-opamp-server.labels" (dict "ctx" . "component" "bootstrap") | nindent 4 }}
data:
  bootstrap.sql: |
    {{- .Files.Get "files/bootstrap.sql" | nindent 4 }}
  initdb.sh: |
    {{- .Files.Get "files/initdb.sh" | nindent 4 }}
