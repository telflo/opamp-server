{{- include "telflo-opamp-server.guards" . }}
{{- if .Values.serviceAccount.create }}
{{- /* The server's account. It calls no Kubernetes API: no token is mounted. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "telflo-opamp-server.serviceAccountName" . | quote }}
  labels:
    {{- include "telflo-opamp-server.labels" (dict "ctx" . "component" "server") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
