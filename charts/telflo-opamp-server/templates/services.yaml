{{- include "telflo-opamp-server.guards" . }}
{{- $agent := .Values.service.agent }}
{{- /*
Two Services, one per component's Deployment, for their two audiences. The
agent endpoint is where collectors poll: its type is a value (behind a load
balancer, typically). The management API's shared secret opens every
organization, so its Service is always ClusterIP, with no type value:
reaching it from outside the cluster is your own Service or `kubectl
port-forward` (README.md).
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-agent" (include "telflo-opamp-server.fullname" .) | quote }}
  labels:
    {{- include "telflo-opamp-server.labels" (dict "ctx" . "component" "agent") | nindent 4 }}
  {{- with $agent.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $agent.type | quote }}
  {{- with $agent.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "telflo-opamp-server.selectorLabels" (dict "ctx" . "component" "agent") | nindent 4 }}
  ports:
    - name: agent
      port: {{ int $agent.port }}
      targetPort: agent
      protocol: TCP
      {{- if not (kindIs "invalid" $agent.nodePort) }}
      nodePort: {{ int $agent.nodePort }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-management" (include "telflo-opamp-server.fullname" .) | quote }}
  labels:
    {{- include "telflo-opamp-server.labels" (dict "ctx" . "component" "management") | nindent 4 }}
  {{- with .Values.service.management.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "telflo-opamp-server.selectorLabels" (dict "ctx" . "component" "management") | nindent 4 }}
  ports:
    - name: management
      port: 51235
      targetPort: management
      protocol: TCP
