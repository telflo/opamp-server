name: Bug report
description: Something doesn't work as the documentation says it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A security problem? Don't file it here: see SECURITY.md.
        Leave out secrets, tokens, API keys and passwords from everything below.
  - type: input
    id: version
    attributes:
      label: Version
      description: The release (such as 0.2.4), or the commit if you built it.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - The Quick start (Docker Compose)
        - The release binary
        - The image, run yourself
        - The Helm chart
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The commands or API calls, in order.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The server's log lines around it, and the Supervisor's if a collector is involved.
      render: text
  - type: input
    id: environment
    attributes:
      label: Environment
      description: PostgreSQL version, collector and Supervisor version, OS or Kubernetes version.
